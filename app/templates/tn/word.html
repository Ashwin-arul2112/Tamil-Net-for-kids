<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <title>TamilNet for Kids</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap & External CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="static/styles.css">
    <script src="static/wmain.js" defer></script>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body {
            font-family: 'Fredoka One', cursive;
            background: linear-gradient(120deg, #fceff9, #d0e6f6);
            color: #333;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        h1 {
            text-align: center;
            font-size: 3.5rem;
            color: #fff;
            text-shadow: 2px 2px 5px #ff6b81;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        #guess {
            font-size: 5.5rem;
            color: #fff;
            animation: colorChange 2s infinite, pop 0.8s ease-in-out;
        }

        @keyframes colorChange {
            0% { color: #0f0e0f; }
            50% { color: #ae5e8d; }
            100% { color: #af266d; }
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        #all {
            background-color: rgba(255, 255, 255, 0.85);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            margin-top: 30px;
        }

        button {
    background-color: #ff92a5;
    border: none;
    padding: 15px 30px;
    border-radius: 20px;
    font-size: 1.4rem;
    margin: 10px;
    color: #fff;
    font-weight: bold;
    transition: all 0.3s ease-in-out;
    box-shadow: 0 5px 15px rgba(255, 105, 135, 0.4);
}

button:hover {
    background-color: #ffa6b6;
    transform: scale(1.1);
}


        canvas {
            border: 5px dotted #ff6b81;
            background-color: #fff;
            margin-bottom: 15px;
            width: 300px;
            height: 300px;
        }

        #suggestion {
            font-size: 5rem;
            color: #d6336c;
            animation: glow 2s infinite;
        }

        @keyframes glow {
            0% { text-shadow: 0 0 10px #0e0107; }
            50% { text-shadow: 0 0 20px #ff6b81; }
            100% { text-shadow: 0 0 10px #c63078; }
        }

        #confidence {
            color: #20c997;
        }

        .back-btn {
            background-color: #ff6b81;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 15px;
            font-size: 1rem;
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .back-btn:hover {
            background-color: #ff99aa;
            transform: scale(1.05);
        }

        #instructions h3 {
            font-size: 2rem;
            color: #ff4081;
        }

        #myguess {
            font-size: 1.8rem;
        }

        .mascot-img {
            width: 100px;
            height: auto;
            display: block;
            margin: 0 auto 15px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            canvas {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <button class="back-btn" onclick="window.location.href='http://127.0.0.1:5000/main'">← Back</button>

    <h1>🎨 Tamil Character Fun Zone!</h1>

    <div id="all" class="row justify-content-center">
        <div id="instructions" class="col-md-4 text-center">
            <img src="https://cdn-icons-png.flaticon.com/512/3555/3555627.png" alt="Mascot" class="mascot-img" />
            <h3>Try Drawing</h3>
            <p id="suggestion">அம்மா</p>
        </div>

        <div id="drawarea" class="col-md-auto text-center">
            <canvas id="canvas" width="300px" height="300px"></canvas>
            <div id="buttons">
                <button type="button" id="clear" onclick="clearCanvas()">🧼 Clear</button>
                <button type="button" id="submit" onclick="submitImage()">🔍 Read</button>
            </div>
        </div>

        <div id="guessarea" class="col-md-4 text-center">
            <p id="myguess">My guess:</p>
            <p id="guess">🤔</p>
            <p id="confidence" class="h5"></p>
            <button type="button" onclick="backspace()">⌫</button>
        </div>
    </div>

    <p id="info" class="fixed-bottom text-center"></p>
    <div id="links" class="fixed-bottom text-center">
        <a></a>
        <p id="divider"></p>
        <a></a>
    </div>

    <div>
        <p id="result"></p>
    </div>
</body>
</html>
