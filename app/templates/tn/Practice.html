<!DOCTYPE html>
<html>
<head>
    <title>TamilNet for Kids</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="static/styles.css">
    <script src="static/main.js"></script>
    <style>
        body {
            background: linear-gradient(120deg, #fceff9, #d0e6f6);
            font-family: 'Comic Sans MS', cursive, sans-serif;
            color: #2c2c2c;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            font-size: 3.5rem;
            color: #ff6b81;
            text-shadow: 2px 2px #fff;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        #guess {
            font-size: 6rem;
            animation: colorChange 1.5s infinite, pop 0.8s ease-in-out;
            text-align: center;
            margin: 10px 0;
        }

        @keyframes colorChange {
            0% { color: #ff6b81; }
            50% { color: #ffe66d; }
            100% { color: #ff6b81; }
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        #all {
            padding: 30px;
            background: #ffffffcc;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            margin-top: 30px;
        }

        button {
            background-color: #ff92a5;
            border: none;
            padding: 15px 30px;
            border-radius: 20px;
            font-size: 1.4rem;
            margin: 10px;
            color: #fff;
            font-weight: bold;
            transition: all 0.3s ease-in-out;
            box-shadow: 0 5px 15px rgba(255, 105, 135, 0.4);
        }

        button:hover {
            background-color: #ffa6b6;
            transform: scale(1.1);
        }

        canvas {
            border: 6px dotted #ff6b81;
            border-radius: 15px;
            background-color: #fff;
            width: 300px;
            height: 300px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        select {
            margin: 10px;
            padding: 8px 12px;
            font-size: 1.2rem;
            border-radius: 10px;
            border: 2px solid #ff6b81;
            background-color: #fff8f9;
        }

        #instructions {
            animation: fadeIn 1.5s ease-in-out;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(-10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        #suggestion {
            font-size: 1.7rem;
            color: #ff4081;
            animation: glow 2s infinite;
        }

        @keyframes glow {
            0% { text-shadow: 0 0 8px #ff4081; }
            50% { text-shadow: 0 0 16px #ff80ab; }
            100% { text-shadow: 0 0 8px #ff4081; }
        }

        #selected-mode {
            font-size: 1.3rem;
            color: #f06292;
            margin-top: 5px;
            font-weight: 500;
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        .back-btn {
            background-color: #ef476f;
            border: none;
            color: white;
            padding: 10px 25px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(239, 71, 111, 0.3);
        }

        .back-btn:hover {
            background-color: #ff5e80;
            transform: scale(1.05);
        }

        #guessarea, #instructions {
            margin-top: 20px;
        }

        #confidence {
            color: #3d3d3d;
            margin-top: -10px;
        }

        #myguess {
            font-size: 1.5rem;
            font-weight: bold;
        }

        #divider {
            display: none;
        }

        #result {
            text-align: center;
            margin-top: 30px;
            font-size: 1.3rem;
            color: #444;
        }

        #info {
            text-align: center;
            font-size: 1rem;
            color: #555;
            background-color: #f8f8f8;
            padding: 10px;
            border-top: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <button class="back-btn" onclick="window.location.href='http://127.0.0.1:5000/main'">← Back</button>

    <h1 class="h1">Tamil Character Fun Zone!</h1>

    <!-- Mode Selector -->
    <div class="text-center">
        <label for="mode">Select Mode: </label>
        <select id="mode" onchange="displayMode()">
            <option value="Easy">Easy</option>
            <option value="Medium">Medium</option>
            <option value="Hard">Hard</option>
        </select>
        <p id="selected-mode">Current Mode: Easy</p>
    </div>

    <!-- Game Area -->
    <div id="all" class="row justify-content-center">
        <div id="instructions" class="col-md-4">
            <h3 id="howto" class="h4">Let's Play and Learn:</h3>
            <ol>
                <li id="suggestion">Draw a Tamil character. Not sure what to draw? Try <span style="color: #ff6b81; font-size: 2rem;"></span></li>
                <li>Then, Click "Read" to see the magic!</li>
                <li>Finally, Click "Clear" to start fresh!</li>
            </ol>
        </div>
        <div id="drawarea" class="col-md-auto">
            <canvas id="canvas" width="300px" height="300px"></canvas>
            <div id="buttons">
                <button type="button" class="btn" id="clear" onclick="clearCanvas()">🧼 Clear</button>
                <button type="button" class="btn" id="submit" onclick="submitImage()">🔍 Read</button>
            </div>
        </div>
        <div id="guessarea" class="col-md-4">
            <p id="myguess" class="text-center">My guess:</p>
            <p id="guess" class="h1 text-center">🤔</p>
            <p id="confidence" class="h5 font-weight-normal text-center"></p>
        </div>
    </div>

    <p id="info" class="fixed-bottom"></p>
    <div id="links" class="fixed-bottom">
        <a></a>
        <p id="divider"></p>
        <a></a>
    </div>

    <div>
        <p id="result"></p>
    </div>

    <script>
        function displayMode() {
            const mode = document.getElementById("mode").value;
            document.getElementById("selected-mode").textContent = "Current Mode: " + mode;
            setmode(mode);
        }

        document.getElementById('runButton')?.addEventListener('click', function() {
            fetch('/run-function')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('result').textContent = data.message;
                })
                .catch(error => {
                    console.error('Error:', error);
                });
        });
    </script>
</body>
</html>
