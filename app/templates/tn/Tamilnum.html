<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tamil Numbers Counting Game</title>

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      font-family: 'Comic Sans MS', cursive;
      text-align: center;
      background: linear-gradient(120deg, #fceff9, #d0e6f6);
      color: #333;
      margin: 0;
      padding-bottom: 120px;
      overflow-x: hidden;
    }

    .animated-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    .bubble {
      position: absolute;
      width: 20px;
      height: 20px;
      background-color: rgba(255, 182, 193, 0.6);
      border-radius: 50%;
      animation: floatUp 10s infinite ease-in;
    }

    @keyframes floatUp {
      from { transform: translateY(100vh); opacity: 0.6; }
      to { transform: translateY(-10vh); opacity: 0; }
    }

    h1 {
      font-size: 3rem;
      color: #ff6b81;
      margin: 30px 0 10px;
      animation: bounce 1.5s infinite;
    }

    @keyframes bounce {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
    }

    #object-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin: 20px 0;
    }

    .numdis {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(45deg, #ff6b81, #ffb6c1, #ffccd5);
      padding: 15px 30px;
      border-radius: 15px;
      color: white;
      font-size: 2.5rem;
      font-weight: bold;
      animation: glow 1.5s ease-in-out infinite;
    }

    @keyframes glow {
      0%,100% { box-shadow: 0 0 10px #ff6b81, 0 0 20px #ffb6c1; }
      50%   { box-shadow: 0 0 20px #ffccd5, 0 0 30px #ff6b81; }
    }

    footer {
      position: fixed;
      bottom: 0; left: 0; width: 100%;
      background-color: #ffb6c1;
      padding: 10px;
      display: flex;
      justify-content: center;
      gap: 20px;
      z-index: 10;
    }

    footer button {
      padding: 15px 30px;
      font-size: 1.3rem;
      border: none;
      border-radius: 12px;
      background-color: #ff6b81;
      color: white;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
    }

    footer button:hover {
      background-color: #ffaebf;
      transform: scale(1.05);
    }

    .object {
      width: 70px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.5rem;
      transition: transform 0.3s, box-shadow 0.3s;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      animation: popIn 0.4s ease;
      position: relative;
      cursor: pointer;
    }

    .object:active {
      transform: scale(1.2);
      animation: pulse 0.4s ease;
    }

    @keyframes popIn {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }

    .circle { border-radius: 50%; }
    .square { border-radius: 0; }
    .rounded { border-radius: 15%; }
    .diamond { transform: rotate(45deg); }
    .triangle {
      width: 0; height: 0;
      border-left: 35px solid transparent;
      border-right:35px solid transparent;
      border-bottom:70px solid var(--triangle-color, #ff6b81);
      background: transparent !important;
      box-shadow: none;
    }

    .triangle-label {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 1.5rem;
      pointer-events: none;
    }

    .hexagon { clip-path: polygon(25% 5%,75%5%,100%50%,75%95%,25%95%,0%50%); }
    .octagon { clip-path: polygon(30%0,70%0,100%30%,100%70%,70%100%,30%100%,0%70%,0%30%); }
    .star {
      clip-path: polygon(
        50% 0%, 61% 35%, 98% 35%, 68% 57%,
        79% 91%, 50% 70%, 21% 91%, 32% 57%,
        2% 35%, 39% 35%
      );
    }

    .back-btn {
      background-color: #ef476f;
      border: none;
      color: white;
      padding: 10px 25px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(239, 71, 111, 0.3);
    }

    .back-btn:hover { 
      background-color: #ffa6b6;
      transform: scale(1.05);
    }

    @media(max-width:600px){
      h1 { font-size:2.2rem; }
      .object { width:60px; height:60px; font-size:1.2rem; }
      .numdis { font-size:2rem; padding:10px 20px; }
      footer { flex-direction: column; gap: 10px; }
    }
  </style>
</head>
<body>
  <div class="animated-bg" id="bg-animation"></div>

  <button class="back-btn" onclick="goBack()">← Back</button>
  <h1>தமிழ் எண்கள் விளையாட்டு 🎲</h1>

  <div class="game-container">
    <p>🔢 ஒவ்வொன்றாக அழுத்தி எண்ணை காண்பியுங்கள்!</p>
    <div id="object-container"></div>
    <p class="numdis" id="tamil-number">சூற்சி</p>
  </div>

  <footer>
    <button id="count-btn">➕ Count</button>
    <button id="reset-btn">🔄 Reset</button>
  </footer>

  <script>
    let objectCount = 0;
    const tamilNumbers = [ "ஒன்ரு", "இரு", "மூன்று", "நான்கு", "ஐந்து", "ஆறு", "ஏழு", "எட்டு", "ஒன்பது", "பத்து",
      "பதினொன்று", "பன்னிரண்டு", "பதின்மூன்று", "பதினான்கு", "பதினைந்து", "பதினாறு", "பதினேழு", "பதினெட்டு", "பதினொன்பது", "இருபது",
      "இருபத்தொன்று", "இருபத்திரண்டு", "இருபத்திமூன்று", "இருபத்திநான்கு", "இருபத்திஐந்து", "இருபத்திஆறு", "இருபத்திஏழு", "இருபத்திஎட்டு", "இருபத்திஒன்பது", "முப்பது",
      "முப்பத்தொன்று", "முப்பத்திரண்டு", "முப்பத்திமூன்று", "முப்பத்திநான்கு", "முப்பத்திஐந்து", "முப்பத்திஆறு", "முப்பத்திஏழு", "முப்பத்திஎட்டு", "முப்பத்திஒன்பது", "நாற்பது",
      "நாற்பத்தொன்று", "நாற்பத்திரண்டு", "நாற்பத்திமூன்று", "நாற்பத்திநான்கு", "நாற்பத்திஐந்து", "நாற்பத்திஆறு", "நாற்பத்திஏழு", "நாற்பத்திஎட்டு", "நாற்பத்திஒன்பது", "ஐம்பது",
      "ஐம்பத்தொன்று", "ஐம்பத்திரண்டு", "ஐம்பத்திமூன்று", "ஐம்பத்திநான்கு", "ஐம்பத்திஐந்து", "ஐம்பத்திஆறு", "ஐம்பத்திஏழு", "ஐம்பத்திஎட்டு", "ஐம்பத்திஒன்பது", "அறுபது",
      "அறுபத்தொன்று", "அறுபத்திரண்டு", "அறுபத்திமூன்று", "அறுபத்திநான்கு", "அறுபத்திஐந்து", "அறுபத்திஆறு", "அறுபத்திஏழு", "அறுபத்திஎட்டு", "அறுபத்திஒன்பது", "எழுபது",
      "எழுபத்தொன்று", "எழுபத்திரண்டு", "எழுபத்திமூன்று", "எழுபத்திநான்கு", "எழுபத்திஐந்து", "எழுபத்திஆறு", "எழுபத்திஏழு", "எழுபத்திஎட்டு", "எழுபத்திஒன்பது", "எண்பது",
      "எண்பத்தொன்று", "எண்பத்திரண்டு", "எண்பத்திமூன்று", "எண்பத்திநான்கு", "எண்பத்திஐந்து", "எண்பத்திஆறு", "எண்பத்திஏழு", "எண்பத்திஎட்டு", "எண்பத்திஒன்பது", "தொண்ணூறு",
      "தொண்ணூற்றொன்று", "தொண்ணூற்றிரண்டு", "தொண்ணூற்றிமூன்று", "தொண்ணூற்றிநான்கு", "தொண்ணூற்றிஐந்து", "தொண்ணூற்றிஆறு", "தொண்ணூற்றிஏழு", "தொண்ணூற்றிஎட்டு", "தொண்ணூற்றிஒன்பது", "நூறு"
    ];
    const shapes = ["circle", "square", "rounded", "diamond", "triangle", "hexagon", "octagon", "star"];
    const objectContainer = document.getElementById("object-container");
    const tamilNumberDisplay = document.getElementById("tamil-number");
    const countBtn = document.getElementById("count-btn");
    const resetBtn = document.getElementById("reset-btn");

    const shapeNames = {
      "circle": ["Circle", "வட்டம்"],
      "square": ["Square", "சதுரம்"],
      "rounded": ["Rounded Square", "முழுமையாக சதுரம்"],
      "diamond": ["Diamond", "வைரம்"],
      "triangle": ["Triangle", "முக்கோணம்"],
      "hexagon": ["Hexagon", "ஆறுபக்க வடிவம்"],
      "octagon": ["Octagon", "எண்பக்க வடிவம்"],
      "star": ["Star", "நட்சத்திரம்"]
    };

    function getRandomColor() {
      const cs = ['#ff6b81', '#f7b32b', '#32a852', '#2b8cf7', '#ff7f50', '#9b59b6', '#f39c12', '#1abc9c'];
      return cs[Math.floor(Math.random() * cs.length)];
    }

    countBtn.onclick = () => {
  if (objectCount >= tamilNumbers.length) {
    Swal.fire('நிறைவு!', 'அனைத்தும் எண்ணப்பட்டுவிட்டது!', 'info');
    triggerBurst(); // 🔥 final burst
    return;
  }

  objectCount++;
  addShape();
  tamilNumberDisplay.textContent = tamilNumbers[objectCount - 1];

  // 🔟🎉 Fire burst only at multiples of 10
  if (objectCount % 10 === 0) {
    triggerBurst();
  }
};

    resetBtn.onclick = () => {
      objectCount = 0;
      objectContainer.innerHTML = "";
      tamilNumberDisplay.textContent = "சூற்சி";
    };
    function triggerBurst() {
  const count = 200;
  const defaults = {
    origin: { y: 0.6 }
  };

  function fire(particleRatio, opts) {
    confetti(Object.assign({}, defaults, opts, {
      particleCount: Math.floor(count * particleRatio)
    }));
  }

  fire(0.25, {
    spread: 26,
    startVelocity: 55,
  });
  fire(0.2, {
    spread: 60,
  });
  fire(0.35, {
    spread: 100,
    decay: 0.91,
    scalar: 0.8
  });
  fire(0.1, {
    spread: 120,
    startVelocity: 25,
    decay: 0.92,
    scalar: 1.2
  });
  fire(0.1, {
    spread: 120,
    startVelocity: 45,
  });
}

    function addShape() {
      const shapeType = shapes[Math.floor(Math.random() * shapes.length)];
      const shape = document.createElement("div");
      shape.className = `object ${shapeType}`;
      shape.style.backgroundColor = getRandomColor();

      if (shapeType === "triangle") {
        shape.style.setProperty("--triangle-color", getRandomColor());
        const label = document.createElement("div");
        label.className = "triangle-label";
        label.innerText = objectCount;
        shape.appendChild(label);
      } else {
        shape.textContent = objectCount;
      }

      shape.onclick = () => {
        const [english, tamil] = shapeNames[shapeType];
        Swal.fire({
          title: `${english}`,
          text: `தமிழில்: ${tamil}`,
          icon: 'info',
          confirmButtonText: 'சரி 😊'
        });
      };

      objectContainer.appendChild(shape);
    }
    setInterval(() => {
      const bubble = document.createElement("div");
      bubble.classList.add("bubble");
      bubble.style.left = `${Math.random() * 100}%`;
      bubble.style.animationDuration = `${Math.random() * 5 + 5}s`;
      document.getElementById("bg-animation").appendChild(bubble);
      setTimeout(() => {
        bubble.remove();
      }, 10000); // Remove after animation ends
    }, 300);

    function goBack() {
      if (document.referrer) {
        window.history.back();
      } else {
        window.location.href = "/";
      }
    }

    function createBubbles() {
      const bg = document.getElementById('bg-animation');
      for (let i = 0; i < 30; i++) {
        const bubble = document.createElement('div');
        bubble.classList.add('bubble');
        bubble.style.left = `${Math.random() * 100}%`;
        bubble.style.animationDuration = `${8 + Math.random() * 5}s`;
        bubble.style.width = bubble.style.height = `${10 + Math.random() * 20}px`;
        bg.appendChild(bubble);
      }
    }

    createBubbles();
  </script>
</body>
</html>
