<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>📚 Parent Dashboard | TamilNet</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Comic Sans MS", cursive, sans-serif;
      background: linear-gradient(120deg, #fceff9, #d0e6f6);
      color: #333;
    }

    .navbar {
      background: #fff0f5;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 30px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    .navbar h2 {
      font-size: 2rem;
      color: #ff69b4;
    }

    .navbar button {
      background-color: #ff69b4;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 1rem;
      transition: 0.3s;
    }

    .navbar button:hover {
      background-color: #ffa3cb;
      transform: scale(1.05);
    }

    .container {
      max-width: 960px;
      margin: 30px auto;
      padding: 0 20px;
    }

    h1 {
      text-align: center;
      font-size: 2.5rem;
      color: #ff69b4;
      margin-bottom: 40px;
      text-shadow: 1px 1px #ffc8dd;
    }

    .dashboard-card {
      background: #ffffffdd;
      border-radius: 20px;
      padding: 25px 30px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      margin-bottom: 30px;
      position: relative;
      animation: fadeUp 0.8s ease;
    }

    .dashboard-card:hover {
      transform: translateY(-5px);
      transition: 0.3s;
    }

    @keyframes fadeUp {
      0% {
        opacity: 0;
        transform: translateY(30px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .dashboard-card h4 {
      color: #ff69b4;
      margin-bottom: 20px;
    }

    canvas {
      max-width: 100%;
    }

    ul li {
      font-size: 1.1rem;
      margin-bottom: 5px;
    }

    .info-bubble {
      background-color: #ff69b4;
      color: white;
      padding: 5px 10px;
      border-radius: 50%;
      font-size: 0.8rem;
      margin-left: 8px;
      cursor: pointer;
    }

    .info-bubble:hover::after {
      content: attr(data-info);
      position: absolute;
      background: #fff;
      color: #333;
      padding: 6px 12px;
      font-size: 0.9rem;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      white-space: nowrap;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
    }

    .mascot {
      width: 80px;
      position: absolute;
      bottom: 10px;
      right: 15px;
      opacity: 0.7;
    }

    .sparkle {
      animation: blink 1.5s infinite ease-in-out;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.1); }
    }

    @media (max-width: 768px) {
      .navbar h2 {
        font-size: 1.5rem;
      }
      h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>

  <div class="navbar">
    <h2>👨‍👩‍👧‍👦 Parent Zone</h2>
    <button onclick="window.location.href='http://127.0.0.1:5000/main'">← Back</button>
  </div>

  <div class="container">
    <h1>📊 TamilNet Progress Dashboard</h1>

    <div class="dashboard-card" id="childList">
      <h4>👶 Children Linked to You 
        <span class="info-bubble sparkle" data-info="Child accounts under your parent login.">i</span>
      </h4>
      <p>🔄 Loading child data...</p>
    </div>

    <div class="dashboard-card">
      <h4>🎯 Learning Stats 
        <span class="info-bubble sparkle" data-info="Shows child's correct answers.">i</span>
      </h4>
      <canvas id="learningChart"></canvas>
      <img src="https://cdn-icons-png.flaticon.com/512/1048/1048918.png" class="mascot" alt="Cute Mascot" />
    </div>

    <div class="dashboard-card">
      <h4>🏆 Most Practiced 
        <span class="info-bubble sparkle" data-info="Frequently used Tamil letters/words.">i</span>
      </h4>
      <ul>
        <li>✨ Letters: <strong>அ</strong>, <strong>க</strong>, <strong>ம</strong>, <strong>ந</strong></li>
        <li>🌸 Words: <strong>அம்மா</strong>, <strong>கண்ணி</strong></li>
      </ul>
      <img src="https://cdn-icons-png.flaticon.com/512/2631/2631394.png" class="mascot" alt="Cute Flower" />
    </div>

    <div class="dashboard-card">
      <h4>⏱️ Time Spent 
        <span class="info-bubble sparkle" data-info="Time spent in sessions.">i</span>
      </h4>
      <p>This week: <strong>1 hour 45 minutes</strong></p>
      <p>Total: <strong>5 hours 16 minutes</strong></p>
      <img src="https://cdn-icons-png.flaticon.com/512/3771/3771421.png" class="mascot" alt="Cute Clock" />
    </div>
  </div>

  <script>
    // Learning Stats Chart
    const ctx = document.getElementById('learningChart').getContext('2d');
    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['Letters', 'Words', 'Numbers'],
        datasets: [{
          label: 'Correct Answers',
          data: [20, 12, 8],
          backgroundColor: ['#ffd6e0', '#c5f5fa', '#ffd1dc'],
          borderRadius: 20
        }]
      },
      options: {
        scales: {
          y: { beginAtZero: true }
        },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#ff69b4',
            titleColor: '#fff',
            bodyColor: '#fff',
            borderColor: '#fff',
            borderWidth: 1
          }
        }
      }
    });

    // Fetch children data dynamically 💡
    fetch('/parent-dashboard-data')
    .then(res => res.json())
    .then(data => {
      const listDiv = document.getElementById('childList');
      if (data.success) {
        listDiv.innerHTML = `
          <h4>👶 Children Linked to You 
            <span class="info-bubble sparkle" data-info="Child accounts under your parent login.">i</span>
          </h4>
          <ul>
            ${data.children.map(child => `
              <li><strong>${child.childname}</strong> (Age: ${child.age}, User: ${child.username})</li>
            `).join('')}
          </ul>
        `;
      } else {
        listDiv.innerHTML = "<p>⚠️ No children found or session expired.</p>";
      }
    })
    .catch(() => {
      document.getElementById('childList').innerHTML = "<p>❌ Error loading children data.</p>";
    });
  </script>

</body>
</html>
